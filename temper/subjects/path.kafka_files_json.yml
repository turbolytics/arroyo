id: path.kafka_files_json
kind: path
feature: sink.filesystem
implements: [Files]
# Shaped like Cloudflare Pipelines: raw JSON files on R2, 10 s roll (the minimum).
answers:
  faults.contract:
    worker_kill: supported
    node_kill: supported
    stop_with_checkpoint: supported
    stop_immediately: supported
    storage_outage: supported
    worker_pause: supported
    broker_pause: supported
    node_partition: supported
    long_storage_stall: supported
    long_broker_pause: supported
    quiet_restart: supported
    idle_partition_restart: supported
    kill_during_commit: supported
