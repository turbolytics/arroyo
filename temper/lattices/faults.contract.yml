id: faults.contract
description: >
  The faults a production pipeline recovers from. A supported answer means every
  delivery invariant holds under that fault. The set comes from the docs'
  recovery claims (concepts, architecture) and how pipelines are deployed.
applies_to: path
requires: [controller, worker_leader]
members:
  # kill -9 of a worker process at a random moment
  - key: worker_kill
  # kill -9 of the whole node, then a restart
  - key: node_kill
  # stop with a final checkpoint, then resume, as a deploy does
  - key: stop_with_checkpoint
  # stop without a checkpoint, then resume from the last one
  - key: stop_immediately
  # the object store holding checkpoints pauses, then resumes
  - key: storage_outage
  # kill -9 while the sink commits a checkpoint
  - key: kill_during_commit
  # Jepsen-style faults (jepsen.io analyses of Redpanda 21.10.1 and Bufstream 0.1.0)
  # SIGSTOP a worker past the 30 s heartbeat timeout, then SIGCONT it (a zombie)
  - key: worker_pause
  # the Kafka broker pauses for 20 s, then resumes
  - key: broker_pause
  # the Arroyo node loses its network (Kafka and storage) for 20 s
  - key: node_partition
  # the object store pauses for 75 s, past Kafka's 60 s transaction timeout
  - key: long_storage_stall
  # the Kafka broker pauses for 75 s, past its 60 s transaction timeout
  - key: long_broker_pause
  # Lifecycle, no fault: stop with a checkpoint and resume (a deploy), with no
  # input in between, then stop again while input arrives, then resume
  - key: quiet_restart
  # the same, but only some source partitions receive input between the deploys
  - key: idle_partition_restart
